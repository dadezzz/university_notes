apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: default
spec:
  hostnames:
    - ice-notes.zarantonello.dev
  parentRefs:
    - name: srv-hetz-nbg-0-public-https
      namespace: cilium
  rules:
    - backendRefs:
        - name: notes
          port: 80
      filters:
        # Allow access to send back Umami metrics.
        - responseHeaderModifier:
            add:
              - name: Access-Control-Allow-Origin
                value: https://metrics.zarantonello.dev
          type: ResponseHeaderModifier
      matches:
        - path:
            type: PathPrefix
            value: /
