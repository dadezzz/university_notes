services:
  workspace:
    entrypoint: sleep infinity
    image: git.zarantonello.dev/university/notes-ci:v2026.11.26.1@sha256:9198a997bdb8248ea822774e89110b64ec18d45aaed11baf218e8e0aecd03b71
    ports:
      - 4321:4321
    volumes:
      - ..:/workspace:z,cached
      - pnpm-cache:/usr/local/pnpm/store
      - typst-cache:/root/.cache/typst
    working_dir: /workspace

volumes:
  pnpm-cache: {}
  typst-cache: {}
