services:
  workspace:
    entrypoint: sleep infinity
    image: git.zarantonello.dev/university/notes-ci:v2026.10.19.1@sha256:9e564469f0c593c9516bfbdd0a68cb8099b20a8e1c5b8f3aa8f0ec011f1a6ef1
    ports:
      - 4321:4321
    volumes:
      - ..:/workspace:z,cached
      - pnpm-cache:/usr/local/pnpm/store
      - typst-cache:/root/.cache/typst
    working_dir: /workspace

volumes:
  pnpm-cache: {}
  typst-cache: {}
