services:
  workspace:
    entrypoint: sleep infinity
    image: git.zarantonello.dev/university/notes-ci:v2026.11.16.2@sha256:ea7beb9495be6088e5b5ef37c8761d2771f12d2af21ce3a06ab32b2cfbf3a720
    ports:
      - 4321:4321
    volumes:
      - ..:/workspace:z,cached
      - pnpm-cache:/usr/local/pnpm/store
      - typst-cache:/root/.cache/typst
    working_dir: /workspace

volumes:
  pnpm-cache: {}
  typst-cache: {}
