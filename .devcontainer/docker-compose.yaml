services:
  workspace:
    entrypoint: sleep infinity
    image: git.zarantonello.dev/university/notes-ci:v2026.11.07.1@sha256:5b78989f49a4cf1edf60ec0016814ceb55e82616db4a83ba492e1e2b86a74c24
    ports:
      - 4321:4321
    volumes:
      - ..:/workspace:z,cached
      - pnpm-cache:/usr/local/pnpm/store
      - typst-cache:/root/.cache/typst
    working_dir: /workspace

volumes:
  pnpm-cache: {}
  typst-cache: {}
