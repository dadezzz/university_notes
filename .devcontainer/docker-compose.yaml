services:
  workspace:
    entrypoint: sleep infinity
    image: git.zarantonello.dev/university/notes-ci:v2026.10.12.1@sha256:ce80c0be787f9b5f1050fa1ec81b1cb594c1ee15a98a75178d650c3d9f531d19
    ports:
      - 4321:4321
    volumes:
      - ..:/workspace:z,cached
      - pnpm-cache:/usr/local/pnpm/store
      - typst-cache:/root/.cache/typst
    working_dir: /workspace

volumes:
  pnpm-cache: {}
  typst-cache: {}
