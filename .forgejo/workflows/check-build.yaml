concurrency:
  cancel-in-progress: true
  group: ${{ forge.ref }}-${{ forge.workflow }}

jobs:
  check:
    container:
      image: git.zarantonello.dev/university/notes-ci:v2026.10.25.1@sha256:89949607ad570087fa34b4b4f571781e149dd12d62974776f379b25eca00616b
      volumes:
        - forgejo-runner-cache-pnpm:/usr/local/pnpm/store
        - forgejo-runner-cache-typst:/root/.cache/typst
        - forgejo-runner-cache-university-notes-astro:/astro
    name: Check that project builds
    runs-on: srv-generic
    steps:
      - name: Clone the repository
        run: |
          git clone --filter=blob:none --no-checkout https://${{ forge.token }}:x-oauth-basic@git.zarantonello.dev/${{ forge.repository }} ${{ forge.workspace }};
          git checkout --quiet ${{ forge.sha }};
      - name: Install dependencies with pnpm
        run: pnpm install
      - name: Build the website
        run: pnpm run build

name: check-build.yaml

"on":
  pull_request:
    branches:
      - main
