concurrency:
  cancel-in-progress: true
  group: ${{ forge.ref }}-${{ forge.workflow }}

jobs:
  check:
    container:
      image: git.zarantonello.dev/university/notes-ci:v2026.09.10.1@sha256:e4d396673f38ac1523c877cdae14629bb8d2739e797ae2d1a121f1082256f786
      volumes:
        - forgejo-runner-cache-pnpm:/usr/local/pnpm/store
    name: Check that project builds
    runs-on: srv-generic
    steps:
      - name: Clone the repository
        run: |
          git clone --filter=blob:none --no-checkout https://${{ forge.token }}@git.zarantonello.dev/${{ forge.repository }} ${{ forge.workspace }};
          git checkout --quiet ${{ forge.sha }};
      - name: Install dependencies with pnpm
        run: pnpm install
      - name: Build the website
        run: pnpm run build
      # Can only be done after the site has been built.
      # - name: Check for typst rendering errors
      #   run: sh -c '! grep typst-math-error dist/ -rl'

name: check-build.yaml

"on":
  pull_request:
    branches:
      - main
