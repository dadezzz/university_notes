concurrency:
  cancel-in-progress: true
  group: ${{ forge.ref }}-${{ forge.workflow }}

jobs:
  check:
    container:
      image: git.zarantonello.dev/university/notes:ci@sha256:8f8ec72d44ed70c4dc6ce71a1e3caabb742899cb3865dfc45ea7c86b4710fc81
      volumes:
        - forgejo-runner-cache-pnpm:/usr/local/pnpm/store
    name: Check that project builds
    runs-on: srv-0-thi-home
    steps:
      - name: Clone the repository
        run: |
          git clone --filter=blob:none --no-checkout https://${{ forge.token }}@git.zarantonello.dev/${{ forge.repository }} ${{ forge.workspace }};
          git checkout --quiet ${{ forge.sha }};
      - name: Install dependencies with pnpm
        run: pnpm install
      - name: Build the website
        run: pnpm run build
      # Can only be done after the site has been built.
      - name: Check for latex rendering errors
        run: sh -c '! grep cc0000 dist/ -rl'

name: check-build.yaml

"on":
  pull_request:
    branches:
      - main
