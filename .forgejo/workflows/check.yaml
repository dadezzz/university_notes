concurrency:
  cancel-in-progress: true
  group: ${{ forge.ref }}-${{ forge.workflow }}

jobs:
  check:
    container:
      image: git.zarantonello.dev/university/notes:ci@sha256:16b289e4f9ba67024a511ce921bf08ffab6749da651cfa37814a968148d4725a
      volumes:
        - forgejo-runner-cache-pnpm:/cache/pnpm
    name: Checks
    runs-on: srv-0-thi-home
    steps:
      - name: Clone the repository
        run: |
          git clone --filter=blob:none --no-checkout https://${{ forge.token }}@git.zarantonello.dev/${{ forge.repository }} ${{ forge.workspace }};
          git checkout --quiet ${{ forge.sha }};
      - name: Restore the pnpm cache
        run: if [ -d /cache/pnpm/.pnpm-store ] ; then cp -r /cache/pnpm/.pnpm-store/ . ; fi
      - name: Install dependencies with pnpm
        run: pnpm install
      - name: Run formatter
        run: pnpm run format:check
      - name: Run linter
        run: pnpm run lint:check
      - name: Run types and syntax check
        run: pnpm run check
      - name: Build the website
        run: pnpm run build
      - name: Check for latex rendering errors
        run: sh -c '! grep cc0000 dist/ -rl'
      - if: always()
        name: Save the pnpm cache
        run: |
          rm -rf /cache/pnpm/.pnpm-store/
          cp -r .pnpm-store/ /cache/pnpm/

name: check.yaml

"on":
  pull_request:
    branches:
      - main
