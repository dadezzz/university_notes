concurrency:
  cancel-in-progress: true
  group: ${{ forge.ref }}-${{ forge.workflow }}

jobs:
  check:
    container:
      image: git.zarantonello.dev/university/notes-ci:v2026.10.18.1@sha256:8507ee1571b234560ab4bd14296ab195bcd8e6892ab08dd8ff7c34a523b204a1
      volumes:
        - forgejo-runner-cache-pnpm:/usr/local/pnpm/store
        - forgejo-runner-cache-typst:/root/.cache/typst
    name: Checks with static tools
    runs-on: srv-generic
    steps:
      - name: Clone the repository
        run: |
          git clone --filter=blob:none --no-checkout https://${{ forge.token }}@git.zarantonello.dev/${{ forge.repository }} ${{ forge.workspace }};
          git checkout --quiet ${{ forge.sha }};
      - name: Install dependencies with pnpm
        run: pnpm install
      - name: Run types and syntax check
        run: pnpm run check

name: check-syntax.yaml

"on":
  pull_request:
    branches:
      - main
